<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyTwin Airframe #1 · 逐步组装指南</title>
<style>
  :root{
    --paper:#EDEDE8; --ink:#23262B; --ink-2:#5C6168; --line:#C9CBC4;
    --orange:#E3611A; --steel:#7A8C9C; --panel:#F6F6F2; --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.55}
  #app{display:grid;grid-template-columns:1fr 360px;height:100%}
  #viewer{position:relative;overflow:hidden;background:
    radial-gradient(ellipse at 50% 60%, #F4F4EF 0%, #E4E5DF 70%, #D9DAD3 100%)}
  #viewer canvas{display:block;width:100%;height:100%;touch-action:none}
  #load-error{position:absolute;left:16px;right:16px;top:56px;z-index:2;background:#FFF4EC;border:1px solid #F0C9AE;border-radius:4px;padding:10px 12px;font-size:13px;white-space:pre-line}
  #hud{position:absolute;left:16px;bottom:14px;right:16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
  .ctl{pointer-events:auto;background:rgba(246,246,242,.92);border:1px solid var(--line);padding:10px 12px;border-radius:4px}
  .ctl h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink-2)}
  .ctl input[type=range]{width:180px;accent-color:var(--orange)}
  .steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .steps button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:3px;cursor:pointer;font:inherit}
  .steps button:hover{border-color:var(--ink)}
  .steps button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .steps b{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
  #viewer .ctl button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 9px;border-radius:3px;cursor:pointer;font:inherit}
  #viewer .ctl button:hover{border-color:var(--ink)}
  #viewer .ctl button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  #viewer .ctl .views{display:flex;gap:5px;flex-wrap:wrap}
  #viewer .ctl input[type=range]{width:150px;accent-color:var(--orange);vertical-align:middle}
  #tip{position:absolute;top:14px;left:16px;background:rgba(246,246,242,.92);border:1px solid var(--line);
    padding:6px 10px;border-radius:4px;font-size:12px;color:var(--ink-2);pointer-events:none}
  #rail{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:22px 20px 28px}
  #rail h1{font-size:19px;margin:0 0 4px;font-weight:600}
  #rail .sub{color:var(--ink-2);margin:0 0 12px;font-size:13px}
  #rail .note{font-size:12px;background:#FFF4EC;border:1px solid #F0C9AE;border-radius:4px;padding:8px 10px;margin:0 0 14px}
  #guide{position:sticky;top:0;z-index:2;background:var(--panel);padding:12px 0 10px;margin:0 0 10px;border-bottom:1px solid var(--line)}
  #guide .count{font-size:12px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums;margin:0 0 4px}
  #guide h2{font-size:18px;line-height:1.35;margin:0 0 7px;color:var(--ink);letter-spacing:0;text-transform:none}
  #guide .description{font-size:13px;margin:0 0 8px;white-space:pre-line}
  #guide .materials{font-size:12px;margin:0 0 10px;color:var(--ink-2)}
  #guide .materials strong{color:var(--ink)}
  #guide .materials ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:2px}
  #guide .materials li::before{content:"•";color:var(--orange);margin-right:6px}
  #guide .help{font-size:11px;color:var(--ink-2);margin:0 0 8px}
  #guide .guide-controls{display:flex;gap:6px;flex-wrap:wrap}
  #guide button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 9px;border-radius:3px;cursor:pointer;font:inherit}
  #guide button:hover{border-color:var(--ink)}
  #guide button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  #rail h2{font-size:12px;font-weight:600;color:var(--ink-2);margin:20px 0 8px;letter-spacing:.4px}
  #rail a{color:var(--orange)}
  ol.stepslist{list-style:none;padding:0;margin:0;counter-reset:s}
  ol.stepslist li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px;padding:7px 8px;border-radius:3px;cursor:pointer;border:1px solid transparent}
  ol.stepslist li::before{content:counter(s);font-weight:600;color:var(--steel);font-variant-numeric:tabular-nums}
  ol.stepslist li:hover{background:var(--card);border-color:var(--line)}
  ol.stepslist li.on{background:var(--card);border-color:var(--orange)}
  ol.stepslist li.on::before{color:var(--orange)}
  ol.stepslist li.future{opacity:.45}
  ol.stepslist small{display:block;color:var(--ink-2);font-size:12px}
  #detail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  #detail h3{margin:0 0 6px;font-size:15px;font-weight:600}
  #detail p{margin:0 0 8px;font-size:13px}
  #detail .k{color:var(--ink-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .legend .c1::before{background:#202326}.legend .c2::before{background:#2E6B4F}.legend .c3::before{background:#B87333}
  .legend .c4::before{background:#9AA3AA}.legend .c5::before{background:#D9B24B}.legend .c6::before{background:#6F7F8C}.legend .c7::before{background:#C2412D}
  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto;min-height:100%}
    #rail{border-left:0;border-top:1px solid var(--line);padding:18px 16px 24px}
    .ctl input[type=range]{width:100px}
    #hud{left:6px;right:6px;bottom:6px;gap:5px}
    .ctl{padding:6px 8px}
    .ctl h4{margin-bottom:3px}
    #viewer .ctl button{padding:4px 6px;font-size:11px}
    #tip{top:8px;left:8px;font-size:11px}
    #guide{padding-top:10px}
    #guide h2{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="viewer">
    <div id="tip">拖动旋转 · 滚轮或双指缩放 · 点击查看零件</div>
    <div id="load-error" role="status" hidden></div>
    <div id="hud">
      <div class="ctl"><h4>模型视图</h4>
        <div class="views"><button id="all">整机总览</button><button data-v="iso">等轴</button><button data-v="top">俯视</button><button data-v="side">侧视</button><button data-v="front">正视</button><button data-v="under">仰视</button></div>
      </div>
      <div class="ctl"><h4>爆炸图</h4><input id="explode" type="range" min="0" max="1" step="0.01" value="0" aria-label="爆炸程度">
      </div>
    </div>
  </div>
  <aside id="rail">
    <section id="guide" aria-live="polite">
      <p class="count" id="step-count">第 1 步 / 共 36 步</p>
      <h2 id="step-title">正在载入组装步骤…</h2>
      <p class="description" id="step-description"></p>
      <div class="materials" id="step-materials"></div>
      <p class="help" id="step-help">橙色表示本步安装件，动画为位置示意。</p>
      <div class="guide-controls">
        <button id="prev" aria-label="上一步">上一步</button>
        <button id="next" aria-label="下一步">下一步</button>
        <button id="replay">重播本步</button>
      </div>
    </section>
    <h1>FlyTwin Airframe #1</h1>
    <p class="sub">按顺序查看零件安装过程，点击模型中的部件可查看说明。</p>
    <p class="sub"><a href="parts.html">查看单个零件</a></p>
    <p class="note">托盘原始 STL 的中央为开口，内圈螺钉按示意穿过；内圈相向螺钉的净空需要实物核对。</p>
    <div id="detail"><h3>零件信息</h3><p class="k">点击模型中的零件查看名称、安装步骤和说明。</p></div>
    <h2>组装步骤目录</h2>
    <ol class="stepslist" id="steps"></ol>
    <h2>模型颜色</h2>
    <div class="legend"><span class="c1">碳纤维</span><span class="c2">电路板</span><span class="c3">电机</span><span class="c4">金属</span><span class="c5">3D 打印</span><span class="c7">硅胶垫圈</span><span class="c6">线材 / 外设</span></div>
  </aside>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/STLLoader.js"></script>
<script src="stl-assets.js"></script>
<script src="hardware-parts.js"></script>
<script src="assembly-model.js"></script>

<script>
(function(){
  const loadError=document.getElementById('load-error');
  function showLoadError(text){loadError.textContent=text;loadError.hidden=false;}
  if(!window.THREE||!THREE.STLLoader){showLoadError('本地 Three.js 或 STL 加载器未找到。请保留 viewer/vendor 文件。');return;}
  if(typeof window.loadAssemblyStls!=='function'||typeof window.createAssemblyParts!=='function'){
    showLoadError('组装模型脚本未找到。请保留 viewer/stl-assets.js 和 viewer/assembly-model.js。');return;
  }
  window.loadAssemblyStls(THREE).then(function(stlGeometries){
  const viewer=document.getElementById('viewer');
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  viewer.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,1,5000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f88,.85));
  const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(180,320,220);scene.add(sun);
  const fill=new THREE.DirectionalLight(0xffffff,.25);fill.position.set(-200,120,-160);scene.add(fill);
  const disc=new THREE.Mesh(new THREE.CircleGeometry(190,64),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.07}));
  disc.rotation.x=-Math.PI/2;disc.position.y=-92;scene.add(disc);

  const model=window.createAssemblyParts(THREE,stlGeometries);
  const parts=model.parts;
  const tutorial=model.tutorial||[];
  const N=tutorial.length;
  const partByGroup=new Map(),partById=new Map();
  parts.forEach(p=>{
    p.group.userData={id:p.id,name:p.name,step:p.step,tutorialStep:p.tutorialStep,desc:p.desc};
    partByGroup.set(p.group,p);partById.set(p.id,p);
    p.group.traverse(o=>{
      if(!o.isMesh)return;
      const isolate=m=>{
        const copy=m.clone();
        copy.userData=Object.assign({},copy.userData,{
          guideBaseEmissive:copy.emissive?copy.emissive.clone():null,
          guideBaseIntensity:copy.emissiveIntensity||0
        });
        return copy;
      };
      o.material=Array.isArray(o.material)?o.material.map(isolate):isolate(o.material);
    });
    scene.add(p.group);
  });

  const stepsEl=document.getElementById('steps');
  tutorial.forEach((step,i)=>{
    const li=document.createElement('li');
    const label=document.createElement('span');
    label.textContent=step.title||('第 '+(i+1)+' 步');
    const small=document.createElement('small');
    small.textContent=step.description||'';
    label.appendChild(small);li.appendChild(label);
    li.setAttribute('role','button');li.setAttribute('tabindex','0');
    li.setAttribute('aria-label','第 '+(i+1)+' 步：'+(step.title||''));
    li.addEventListener('click',()=>setStep(i+1));
    li.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();setStep(i+1);}
    });
    stepsEl.appendChild(li);
  });

  const target=new THREE.Vector3(0,-8,0);
  let theta=.7,phi=1.05,dist=460,cur=1,overview=false,autoUnderView=false,animationId=null,animationToken=0;
  const exp=document.getElementById('explode');
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const zero=new THREE.Vector3();
  function vec(values){return new THREE.Vector3(values&&values[0]||0,values&&values[1]||0,values&&values[2]||0);}
  function explosionAmount(){return Number(exp.value)||0;}
  function staged(p,n){return !!(p.staging&&n>=p.staging.start&&n<=p.staging.end);}
  function basePosition(p){return p.base?p.base.clone():p.group.position.clone();}
  function finalPosition(p,n=cur,isOverview=overview){
    const position=basePosition(p).addScaledVector(p.explode||zero,explosionAmount());
    if(!isOverview&&staged(p,n)&&p.tutorialStep<=n)position.add(vec(p.staging.offset));
    return position;
  }
  function cancelAnimation(){
    animationToken++;
    if(animationId!==null)cancelAnimationFrame(animationId);
    animationId=null;
  }
  function applyInstantState(){
    parts.forEach(p=>{
      const isVisible=overview||p.tutorialStep<=cur;
      p.group.visible=!!isVisible;
      if(isVisible)p.group.position.copy(finalPosition(p));
    });
  }
  function place(){
    camera.position.set(
      target.x+dist*Math.sin(phi)*Math.sin(theta),
      target.y+dist*Math.cos(phi),
      target.z+dist*Math.sin(phi)*Math.cos(theta)
    );
    camera.lookAt(target);
  }
  function focusParts(selectedParts,step,detail=false){
    const visible=selectedParts.filter(p=>p&&p.group.visible);
    if(!visible.length)return;
    scene.updateMatrixWorld(true);
    const bounds=new THREE.Box3();
    const moveIds=new Set(step&&step.move||[]);
    visible.forEach(p=>{
      const partBounds=new THREE.Box3().setFromObject(p.group);
      bounds.union(partBounds);
      if(moveIds.has(p.id)&&p.staging){
        const offset=vec(p.staging.offset);
        const startBounds=partBounds.clone().translate(offset);
        const raisedBounds=partBounds.clone().translate(offset.clone().add(new THREE.Vector3(0,32,0)));
        bounds.union(startBounds).union(raisedBounds);
      }
    });
    if(bounds.isEmpty())return;
    const center=bounds.getCenter(new THREE.Vector3());
    const radius=bounds.getSize(new THREE.Vector3()).length()/2;
    const halfVerticalFov=THREE.MathUtils.degToRad(camera.fov)/2;
    const halfHorizontalFov=Math.atan(Math.tan(halfVerticalFov)*Math.max(camera.aspect,.5));
    const limitingHalfFov=Math.min(halfVerticalFov,halfHorizontalFov);
    const viewMargin=viewer.clientWidth<=820?1.5:1.32;
    target.copy(center);
    dist=Math.max(detail?95:18,Math.min(1400,(radius/Math.sin(limitingHalfFov))*viewMargin));
    place();
  }
  function focusAll(){focusParts(parts.filter(p=>p.group.visible));}

  let highlighted=new Set(),selected=null,hovered=null;
  function materialsOf(mesh){return Array.isArray(mesh.material)?mesh.material:[mesh.material];}
  function setGroupTone(group,tone){
    if(!group)return;
    group.traverse(o=>{
      if(!o.isMesh)return;
      materialsOf(o).forEach(m=>{
        if(!m.emissive)return;
        const base=m.userData.guideBaseEmissive;
        if(base)m.emissive.copy(base);else m.emissive.set(0x000000);
        m.emissiveIntensity=m.userData.guideBaseIntensity||0;
        if(tone){m.emissive.set(tone.color);m.emissiveIntensity=tone.intensity;}
      });
    });
  }
  function refreshTones(){
    parts.forEach(p=>{
      const tone=highlighted.has(p.id)?{color:0xe3611a,intensity:.8}:
        p.group===selected?{color:0x1796a3,intensity:.65}:
        p.group===hovered?{color:0xffffff,intensity:.3}:null;
      setGroupTone(p.group,tone);
    });
  }
  function updateGuide(){
    const count=document.getElementById('step-count');
    const title=document.getElementById('step-title');
    const description=document.getElementById('step-description');
    const materialBox=document.getElementById('step-materials');
    const help=document.getElementById('step-help');
    const step=tutorial[cur-1];
    if(overview){
      count.textContent='整机总览 · 共 '+N+' 步';
      title.textContent='整机总览';
      description.textContent='所有零件均已显示。可旋转、缩放、切换爆炸图，或从步骤目录继续查看安装过程。';
      materialBox.replaceChildren();
      help.textContent='可从步骤目录返回分步安装，或调整爆炸图查看零件关系。';
    }else if(step){
      count.textContent='第 '+cur+' 步 / 共 '+N+' 步';
      title.textContent=step.title||('第 '+cur+' 步');
      description.textContent=step.description||'';
      help.textContent=repeatedHardwareParts(step).length>0
        ?'橙色表示本步安装件，动画为位置示意。本步聚焦第1处，其余重复件位置相同；可拖动查看或点击“整机总览”。'
        :'橙色表示本步安装件，动画为位置示意。';
      materialBox.replaceChildren();
      const materials=Array.isArray(step.materials)?step.materials:[];
      if(materials.length){
        const label=document.createElement('strong');
        label.textContent='本步材料（'+materials.length+' 项）：';
        const list=document.createElement('ul');
        materials.forEach(material=>{
          const item=document.createElement('li');item.textContent=material;list.appendChild(item);
        });
        materialBox.append(label,list);
      }else materialBox.textContent='本步材料：无单独新增材料';
    }
    [...stepsEl.children].forEach((li,i)=>{
      li.classList.toggle('on',!overview&&i+1===cur);
      li.classList.toggle('future',!overview&&i+1>cur);
      if(!overview&&i+1===cur)li.setAttribute('aria-current','step');
      else li.removeAttribute('aria-current');
    });
    document.getElementById('prev').disabled=!overview&&cur===1;
    document.getElementById('next').disabled=!overview&&cur===N;
  }
  function stepParts(step){
    const ids=new Set([...(step&&step.ids||[]),...(step&&step.move||[])]);
    return [...ids].map(id=>partById.get(id)).filter(Boolean);
  }
  function repeatedHardwareParts(step){
    const ids=step&&step.ids||[];
    const hardwareId=/(?:m\d|nut|washer|screw|bolt|grommet|column|spacer)/i;
    if(ids.length<4||!ids.every(id=>hardwareId.test(id)))return [];
    const matching=ids.map(id=>partById.get(id));
    if(!matching.every(Boolean))return [];
    return ids[0].startsWith('motor-foot-m3x16-')?matching.slice(0,2):[matching[0]];
  }
  function isUnderInstall(step){
    const belowPrefixes=['motor-foot-m3x16-','battery-inner-m3x20-','battery-outer-m3x40-',
      'fc-under-m3-nut-','io-under-m2-washer-','io-m2p5x16-','gps-m3-nut-'];
    return (step&&step.ids||[]).some(id=>id==='legs'||id==='battery-tray'||belowPrefixes.some(prefix=>id.startsWith(prefix)));
  }
  function startStepAnimation(stepPartsList,step){
    if(reducedMotion||!stepPartsList.length)return;
    const moveIds=new Set(step&&step.move||[]);
    scene.updateMatrixWorld(true);
    const entries=[];
    stepPartsList.forEach(p=>{
      if(!p.group.visible)return;
      const end=finalPosition(p,cur,false);
      let start,mode='normal';
      if(moveIds.has(p.id)&&p.staging){
        start=basePosition(p).addScaledVector(p.explode||zero,explosionAmount()).add(vec(p.staging.offset));
        mode='staged';
      }else{
        const separation=(p.explode||zero).clone();
        if(p.id.startsWith('esc-lower-m3-nut-')||p.id.startsWith('esc-lower-m3-washer-'))separation.set(0,1,0);
        else if(separation.lengthSq()<1e-6)separation.set(0,1,0);
        separation.normalize();
        const bounds=new THREE.Box3().setFromObject(p.group);
        const size=bounds.getSize(new THREE.Vector3()).length();
        start=end.clone().addScaledVector(separation,Math.max(12,Math.min(28,size*.12)));
      }
      p.group.position.copy(start);
      entries.push({p:p,start:start,end:end,mode:mode});
    });
    if(!entries.length)return;
    const token=animationToken;
    const startTime=performance.now(),duration=step&&step.move&&step.move.length?1450:1050;
    const ease=t=>t*t*(3-2*t);
    function tick(now){
      if(token!==animationToken)return;
      const t=Math.max(0,Math.min(1,(now-startTime)/duration));
      entries.forEach(entry=>{
        const p=entry.p,start=entry.start,end=entry.end;
        if(entry.mode==='staged'){
          const lift=32;
          if(t<.23){
            const u=ease(t/.23);p.group.position.set(start.x,start.y+lift*u,start.z);
          }else if(t<.75){
            const u=ease((t-.23)/.52);
            p.group.position.set(start.x+(end.x-start.x)*u,start.y+lift,start.z+(end.z-start.z)*u);
          }else{
            const u=ease((t-.75)/.25);
            p.group.position.set(end.x,start.y+lift*(1-u),end.z);
          }
        }else p.group.position.lerpVectors(start,end,ease(t));
      });
      if(t<1)animationId=requestAnimationFrame(tick);else animationId=null;
    }
    animationId=requestAnimationFrame(tick);
  }
  function setStep(value){
    if(!N)return;
    cancelAnimation();
    overview=false;
    cur=Math.max(1,Math.min(N,Number(value)||1));
    if(isUnderInstall(tutorial[cur-1])){phi=2.5;autoUnderView=true;}
    else if(autoUnderView){phi=1.05;autoUnderView=false;}
    highlighted=new Set([...(tutorial[cur-1].ids||[]),...(tutorial[cur-1].move||[])]);
    applyInstantState();
    updateGuide();
    refreshTones();
    const step=tutorial[cur-1];
    const added=stepParts(step);
    const repeated=repeatedHardwareParts(step);
    focusParts(repeated.length?repeated:added,step,repeated.length>0);
    startStepAnimation(added,step);
  }
  function replayStep(){
    if(overview){setStep(cur);return;}
    cancelAnimation();
    applyInstantState();
    const step=tutorial[cur-1];
    const added=stepParts(step);
    scene.updateMatrixWorld(true);
    startStepAnimation(added,step);
  }
  function showOverview(){
    cancelAnimation();overview=true;highlighted.clear();
    applyInstantState();updateGuide();refreshTones();focusAll();
  }
  document.getElementById('prev').onclick=()=>setStep(cur-1);
  document.getElementById('next').onclick=()=>setStep(cur+1);
  document.getElementById('replay').onclick=replayStep;
  document.getElementById('all').onclick=showOverview;
  exp.addEventListener('input',()=>{cancelAnimation();applyInstantState();});

  const el=renderer.domElement;
  function setView(v){
    if(v==='iso'){theta=.7;phi=1.05;}
    if(v==='top'){theta=0;phi=.16;}
    if(v==='side'){theta=Math.PI/2;phi=Math.PI/2-.05;}
    if(v==='front'){theta=0;phi=Math.PI/2-.05;}
    if(v==='under'){theta=.7;phi=2.2;}
    autoUnderView=false;
    place();
  }
  document.querySelectorAll('[data-v]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.v)));

  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
  function findPart(object){
    while(object&&object!==scene){
      const part=partByGroup.get(object);if(part)return part;
      object=object.parent;
    }
    return null;
  }
  function pick(e){
    const rect=el.getBoundingClientRect();
    mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true).map(hit=>findPart(hit.object)).filter(p=>p&&p.group.visible);
    return hits.length?hits[0].group:null;
  }
  function showPart(part){
    const detail=document.getElementById('detail');detail.replaceChildren();
    if(!part){
      const heading=document.createElement('h3');heading.textContent='零件信息';
      const note=document.createElement('p');note.className='k';note.textContent='点击模型中的零件查看名称、安装步骤和说明。';
      detail.append(heading,note);
      detail.scrollIntoView({block:'center',behavior:reducedMotion?'auto':'smooth'});return;
    }
    const heading=document.createElement('h3');heading.textContent=part.name||'零件';detail.appendChild(heading);
    if(part.tutorialStep){
      const fitted=document.createElement('p');fitted.className='k';
      fitted.textContent='首次安装：第 '+part.tutorialStep+' 步';detail.appendChild(fitted);
    }else if(part.step!==undefined&&part.step!==null){
      const fitted=document.createElement('p');fitted.className='k';
      fitted.textContent='零件步骤：'+part.step;detail.appendChild(fitted);
    }
    if(part.desc){const text=document.createElement('p');text.textContent=part.desc;detail.appendChild(text);}
    detail.scrollIntoView({block:'center',behavior:reducedMotion?'auto':'smooth'});
  }
  let pointerDown=false,didMove=false,ignoreClick=false,lastX=0,lastY=0,startX=0,startY=0,pointerId=null;
  const pointers=new Map();let lastPinchDistance=0;
  el.addEventListener('wheel',e=>{
    e.preventDefault();dist=Math.max(18,Math.min(1400,dist*(1+Math.sign(e.deltaY)*.08)));place();
  },{passive:false});
  el.addEventListener('pointerdown',e=>{
    pointerDown=true;didMove=false;pointerId=e.pointerId;
    startX=lastX=e.clientX;startY=lastY=e.clientY;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const pair=[...pointers.values()];
      lastPinchDistance=Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y);
    }
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(pointerDown&&pointers.has(e.pointerId)){
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(Math.hypot(e.clientX-startX,e.clientY-startY)>5)didMove=true;
      if(pointers.size>1){
        const pair=[...pointers.values()];
        const distance=Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y);
        if(lastPinchDistance>0&&distance>0){
          dist=Math.max(18,Math.min(1400,dist*lastPinchDistance/distance));place();
        }
        lastPinchDistance=distance;
      }else if(didMove){
        theta-=(e.clientX-lastX)*.006;
        phi=Math.max(.1,Math.min(Math.PI-.1,phi-(e.clientY-lastY)*.006));
        autoUnderView=false;place();
      }
      lastX=e.clientX;lastY=e.clientY;return;
    }
    const group=pick(e);hovered=group;el.style.cursor=group?'pointer':'grab';refreshTones();
  });
  function endPointer(e){
    if(pointers.has(e.pointerId))pointers.delete(e.pointerId);
    if(pointers.size<2)lastPinchDistance=0;
    if(e.pointerId===pointerId){pointerDown=false;pointerId=null;ignoreClick=didMove;}
  }
  el.addEventListener('pointerup',endPointer);el.addEventListener('pointercancel',endPointer);
  el.addEventListener('click',e=>{
    if(ignoreClick){ignoreClick=false;return;}
    const group=pick(e);selected=group;showPart(group?partByGroup.get(group):null);refreshTones();
  });

  function resize(){
    const w=viewer.clientWidth,h=viewer.clientHeight;
    renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize);resize();place();
  if(N)setStep(1);
  else{
    document.getElementById('step-count').textContent='组装步骤不可用';
    document.getElementById('step-title').textContent='未找到逐步教程数据';
    document.getElementById('step-description').textContent='请检查 assembly-model.js 是否包含 tutorial 数据。';
  }
  (function loop(){renderer.render(scene,camera);requestAnimationFrame(loop);})();
  }).catch(function(error){
    console.error(error);
    showLoadError('模型文件加载失败：'+error.message+'\n请在仓库根目录运行 python3 -m http.server 8000，然后打开 http://localhost:8000/viewer/index.html。');
  });
})();
</script>
</body>
</html>
