<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printed Parts Viewer</title>
<style>
  :root{--paper:#EDEDE8;--ink:#23262B;--ink-2:#5C6168;--line:#C9CBC4;--orange:#E3611A;--panel:#F6F6F2;--card:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.55}
  #app{display:grid;grid-template-columns:1fr 340px;height:100%}
  #viewer{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#F4F4EF 0%,#E4E5DF 70%,#D9DAD3 100%)}
  #viewer canvas{display:block;width:100%;height:100%;touch-action:none}
  #msg{position:absolute;inset:auto 16px 16px 16px;background:#FFF4EC;border:1px solid #F0C9AE;border-radius:4px;padding:10px 12px;font-size:13px;display:none}
  #msg code{background:#fff;padding:1px 4px;border-radius:3px}
  #rail{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:22px 20px}
  h1{font-size:19px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--ink-2);font-size:13px;margin:0 0 16px}
  a{color:var(--orange)}
  .list{display:flex;flex-direction:column;gap:6px}
  .list button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 10px;border-radius:4px;cursor:pointer;font:inherit}
  .list button.on{border-color:var(--orange)}
  .list button small{display:block;color:var(--ink-2);font-size:12px}
  .list button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:18px 0 0;border-top:1px solid var(--line);padding-top:14px}
  dt{color:var(--ink-2)} dd{margin:0;font-variant-numeric:tabular-nums}
  @media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto;min-height:100%}#rail{border-left:0;border-top:1px solid var(--line);padding:18px 16px}}
</style>
</head>
<body>
<div id="app">
  <div id="viewer"><div id="msg"></div></div>
  <aside id="rail">
    <h1>Printed parts</h1>
    <p class="sub">STL files from <a href="../mounts/">mounts/stl/</a>, shown at true size (mm). Drag to rotate, wheel to zoom. Assembly context: <a href="index.html">assembly viewer</a>.</p>
    <div class="list" id="list"></div>
    <dl id="info"></dl>
  </aside>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/STLLoader.js"></script>
<script>
(function(){
  const PARTS=[
    {file:'01_carrier_adapter_plate_V3_new.stl',name:'AS-BUILT · Carrier V3',mat:'As printed: material not verified',color:0xD9B24B},
    {file:'03_gps_mast_v2_rounded_rect.stl',name:'AS-BUILT · GPS mast V2',mat:'As printed: material not verified',color:0xD9B24B},
    {file:'04_battery_tray_TPU_new.stl',name:'AS-BUILT · Battery tray',mat:'As printed: material not verified',color:0xC69A2F},
    {file:'05_esc_plate_38x38x2_8xM3_R1.stl',name:'AS-BUILT · FC/ESC adapter',mat:'As printed: material not verified',color:0xD9B24B},
    {file:'landing_foot_v7.stl',name:'AS-BUILT · Landing foot V7',mat:'As printed: material not verified',color:0xD9B24B},
    {file:'01_carrier_adapter_plate.stl',name:'REFERENCE · Carrier original',mat:'Historical PETG / PLA+',color:0xB0B5A8},
    {file:'02_camera_adapter_TPU.stl',name:'REFERENCE · Camera TPU',mat:'Historical TPU 95A',color:0xB0B5A8},
    {file:'03_gps_mast.stl',name:'REFERENCE · GPS mast original',mat:'Historical PLA',color:0xB0B5A8},
    {file:'04_battery_tray_TPU.stl',name:'REFERENCE · Battery tray original',mat:'Historical TPU 95A',color:0xB0B5A8}
  ];
  const BASE='../mounts/stl/';
  const viewer=document.getElementById('viewer'), msg=document.getElementById('msg');
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); viewer.appendChild(renderer.domElement);
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,1,0.5,5000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f88,.85));
  const sun=new THREE.DirectionalLight(0xffffff,.8); sun.position.set(150,300,200); scene.add(sun);
  const fill=new THREE.DirectionalLight(0xffffff,.3); fill.position.set(-200,100,-150); scene.add(fill);
  const grid=new THREE.GridHelper(200,20,0xb9bbb4,0xd2d3cd); scene.add(grid);
  const loader=new THREE.STLLoader();
  let mesh=null, theta=0.8, phi=1.0, dist=200, target=new THREE.Vector3();
  function place(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);}

  function show(i){
    const p=PARTS[i];
    [...document.getElementById('list').children].forEach((b,j)=>b.classList.toggle('on',i===j));
    loader.load(BASE+p.file,geo=>{
      msg.style.display='none';
      if(mesh){scene.remove(mesh);mesh.geometry.dispose();}
      geo.rotateX(-Math.PI/2);            // files are Z-up; viewer is Y-up
      geo.computeBoundingBox(); const bb=geo.boundingBox, c=new THREE.Vector3(); bb.getCenter(c);
      geo.translate(-c.x,-bb.min.y,-c.z); geo.computeVertexNormals();
      mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:p.color,roughness:.75}));
      scene.add(mesh);
      const s=new THREE.Vector3(); bb.getSize(s);
      target.set(0,s.y/2,0); dist=Math.max(s.x,s.y,s.z)*2.2+40; place();
      let vol=0; const a=geo.attributes.position.array;
      for(let k=0;k<a.length;k+=9){vol+=(a[k]*(a[k+4]*a[k+8]-a[k+5]*a[k+7])-a[k+1]*(a[k+3]*a[k+8]-a[k+5]*a[k+6])+a[k+2]*(a[k+3]*a[k+7]-a[k+4]*a[k+6]))/6;}
      document.getElementById('info').innerHTML=
        `<dt>File</dt><dd><a href="${BASE+p.file}" download>${p.file}</a></dd>`+
        `<dt>Material</dt><dd>${p.mat}</dd>`+
        `<dt>Size (X × Y × Z)</dt><dd>${s.x.toFixed(1)} × ${s.z.toFixed(1)} × ${s.y.toFixed(1)} mm</dd>`+
        `<dt>Volume</dt><dd>${(Math.abs(vol)/1000).toFixed(1)} cm³</dd>`+
        `<dt>Triangles</dt><dd>${(a.length/9).toLocaleString()}</dd>`;
    },undefined,()=>{
      msg.innerHTML='Could not load the STL. Browsers block file loading from <code>file://</code> pages. From the repo root run <code>python -m http.server 8000</code> and open <code>http://localhost:8000/viewer/parts.html</code>, or use GitHub Pages.';
      msg.style.display='block';
    });
  }

  const list=document.getElementById('list');
  PARTS.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=`${p.name}<small>${p.file} · ${p.mat}</small>`;b.onclick=()=>show(i);list.appendChild(b);});

  const el=renderer.domElement; let drag=false,lx=0,ly=0;
  el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-lx)*0.006;phi-=(e.clientY-ly)*0.006;phi=Math.max(0.1,Math.min(1.55,phi));lx=e.clientX;ly=e.clientY;place();});
  el.addEventListener('pointerup',()=>{drag=false;});
  el.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(20,Math.min(1200,dist*(1+Math.sign(e.deltaY)*0.08)));place();},{passive:false});
  let pinch=null;
  el.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
  el.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);dist=Math.max(20,Math.min(1200,dist*pinch/d));pinch=d;place();}},{passive:true});

  function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  addEventListener('resize',resize); resize(); place(); show(0);
  (function loop(){renderer.render(scene,camera);requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
